        <!-- Use the main area to add the main content to the webpage -->
        <main>
            <div id="bookshelf">
                <figure>
                    <img src="images/books/hwfwm.jpg" alt="Book Cover for He Who Fights With Monsters."/>
                    <figcaption>
                        <a href="https://www.goodreads.com/book/show/57189884-he-who-fights-with-monsters" target="_blank">
                            He Who Fights With Monsters
                        </a>
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/books/agot.jpg" alt="Book Cover for a Song of Ice and Fire."/>
                    <figcaption>
                        <a href="https://www.goodreads.com/book/show/13496.A_Game_of_Thrones" target="_blank">
                            A Song of Ice and Fire
                        </a>
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/books/pjo.jpg" alt="Book Cover for Percy Jackson and the Olympians."/>
                    <figcaption>
                        <a href="https://www.goodreads.com/book/show/123675190-the-lightning-thief" target="_blank">
                            Percy Jackson and the Olympains
                        </a>
                    </figcaption>
                </figure>
            </div>

            <div>
                <h2>Submit a Book Recommendation!</h2>
                <form>
                    <label for="sName">Submitter Name:</label><br>
                    <input type="text" id="sName" name="sName"><br>

                    <label for="bTitle">Book Title:</label><br>
                    <input type="text" id="bTitle" name="bTitle"><br>

                    <label for="bAuthor">Book Author:</label><br>
                    <input type="text" id="bAuthor" name="bAuthor"><br>

                    <p>Book Score:</p>
                    <input type="radio" id="rate1" name="bookScore" value="1">
                    <label for="rate1">1</label>
                    <input type="radio" id="rate2" name="bookScore" value="2">
                    <label for="rate2">2</label>
                    <input type="radio" id="rate3" name="bookScore" value="3">
                    <label for="rate3">3</label>
                    <input type="radio" id="rate4" name="bookScore" value="4">
                    <label for="rate4">4</label>
                    <input type="radio" id="rate5" name="bookScore" value="5">
                    <label for="rate5">5</label>
                    <br>
                    <input type="submit" value="Submit">
                </form>
            </div>
        </main>
